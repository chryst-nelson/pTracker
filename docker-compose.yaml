version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ptracker-db
    environment:
      POSTGRES_DB: ptracker
      POSTGRES_USER: ptracker_user
      POSTGRES_PASSWORD: ptracker_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptracker_user -d ptracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ptracker-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ptracker
      SPRING_DATASOURCE_USERNAME: ptracker_user
      SPRING_DATASOURCE_PASSWORD: ptracker_pass
      APP_JWT_SECRET: your-super-secret-key-that-is-at-least-32-characters-long
      APP_JWT_EXPIRATION: 86400000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
