spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mydb2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser2}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword2}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8080
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET:your-super-secret-key-that-is-at-least-32-characters-long}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}